<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Task Manager</title>
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">

                <div class="text-center mb-4">
                    <h1>Task Manager</h1>
                    <p class="text-muted">Manage your tasks efficiently</p>
                </div>

                <div class="d-grid gap-2 mb-4">
                    <button id="showFormBtn" class="btn btn-primary btn-lg">Create New Task</button>
                </div>

                <div class="mt-5">
                    <h3>Your Tasks</h3>

                    <div class="row g-2 mb-3">
                        <div class="col-md-5">
                            <input type="text" id="searchInput" class="form-control" placeholder="Search by title...">
                        </div>
                        <div class="col-md-3">
                            <select id="sortSelect" class="form-select">
                                <option value="title">Sort by Title</option>
                                <option value="priority">Sort by Priority</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button id="searchBtn" class="btn btn-outline-primary w-100">Search</button>
                        </div>
                        <div class="col-md-2">
                            <button id="resetBtn" class="btn btn-outline-secondary w-100">Reset</button>
                        </div>
                    </div>

                    <div id="taskListContainer">
                        <div class="alert alert-info">Loading tasks...</div>
                    </div>

                    <nav aria-label="Page navigation">
                        <ul class="pagination justify-content-center" id="paginationControls"></ul>
                    </nav>
                </div>

            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
